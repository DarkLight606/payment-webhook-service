services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_webhook
      POSTGRES_USER: ${DB_USERNAME:-payment_webhook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payment_webhook}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-payment_webhook} -d payment_webhook"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
